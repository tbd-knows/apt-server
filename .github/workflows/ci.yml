name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: fixture-only
        ports: ["55432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APT_LOCAL_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate persistent host service units
        run: |
          sudo mkdir -p /opt/tbd/node/bin /opt/tbd/hermes/bin
          sudo ln -s "$(command -v node)" /opt/tbd/node/bin/node
          # Syntax/dependency verification only; this stub does not run Hermes.
          sudo ln -s /usr/bin/true /opt/tbd/hermes/bin/hermes
          systemd-analyze verify --man=no deploy/tbd-pilot.target deploy/tbd-server.service deploy/tbd-hermes@founder1.service deploy/tbd-hermes@founder2.service
      - run: npm run test:local-db
      - run: npm run test:a2a-db
      - run: npm run test:harness-db
      - run: npm run test:research-db
      - run: npm run test:mcp-inspection-db
      - run: npm run test:connections-db
      - run: npm run test:service-actions-db
      - run: npm run test:shipping-consent-db
      - run: npm run test:shipping-rates-db
      - run: npm run test:research-safety
      - run: npm run test:commerce-db
      - run: npm run test:commerce-worker
