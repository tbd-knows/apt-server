name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: fixture-only
        ports: ["55432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APT_LOCAL_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:local-db
      - run: npm run test:a2a-db
      - run: npm run test:harness-db
      - run: npm run test:research-db
      - run: npm run test:mcp-inspection-db
      - run: npm run test:connections-db
      - run: npm run test:service-actions-db
      - run: npm run test:research-safety
      - run: npm run test:commerce-db
      - run: npm run test:commerce-worker
