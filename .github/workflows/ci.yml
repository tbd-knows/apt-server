name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: fixture-only
        ports: ["55432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APT_LOCAL_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate persistent host service units
        run: |
          sudo mkdir -p /opt/tbd/node/bin /opt/tbd/hermes/bin
          sudo ln -s "$(command -v node)" /opt/tbd/node/bin/node
          # Syntax/dependency verification only; this stub does not run Hermes.
          sudo ln -s /usr/bin/true /opt/tbd/hermes/bin/hermes
          systemd-analyze verify --man=no deploy/tbd-pilot.target deploy/tbd-server.service deploy/tbd-hermes@founder1.service deploy/tbd-hermes@founder2.service
      - run: npm run test:local-db
      - run: npm run test:a2a-db
      - run: npm run test:harness-db
      - run: npm run test:research-db
      - run: npm run test:mcp-inspection-db
      - run: npm run test:connections-db
      - run: npm run test:service-actions-db
      - run: npm run test:shipping-consent-db
      - run: npm run test:shipping-rates-db
      - run: npm run test:research-safety
      - run: npm run test:commerce-db
      - run: npm run test:commerce-worker

  native-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: fixture-only
        ports: ["55432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APT_LOCAL_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: fcbd1076a93841fa88855acce810e342a5b78101
          path: .hermes-runtime-source
          persist-credentials: false
      - run: npm ci
      - name: Install the pinned native Hermes runtime
        run: |
          python -m venv "$RUNNER_TEMP/tbd-hermes"
          "$RUNNER_TEMP/tbd-hermes/bin/python" -m pip install --editable './.hermes-runtime-source[mcp]' 'aiohttp==3.14.3'
          echo "HERMES_CLI=$RUNNER_TEMP/tbd-hermes/bin/hermes" >> "$GITHUB_ENV"
      - run: npm run test:local-db
      - name: Native A2A and positive connected commerce with synthetic providers
        run: npm run test:hermes-a2a
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: native-agent-commerce-evidence
          path: docs/hermes-a2a-results.json

  render-container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: fixture-only
        ports: ["55432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the combined Render runtime and native verification image
        run: docker build --target verification -f deploy/render.Dockerfile -t tbd-render-check .
      - name: Supervisor startup, private routing and child failure
        run: |
          docker run --rm --entrypoint /opt/tbd/node/bin/node -e APT_RENDER_CONTAINER_SMOKE=1 tbd-render-check scripts/render-supervisor-check.mjs
      - name: Native commerce with the exact container Node/Python/Hermes runtime
        run: |
          docker run --rm --network host \
            -e APT_LOCAL_DATABASE_URL=postgresql://postgres:fixture-only@127.0.0.1:55432/postgres \
            -e HERMES_CLI=/opt/tbd/hermes/bin/hermes tbd-render-check
      # Diagnostic only: a pass is a memory feasibility result, not Render Free
      # acceptance (CPU throttling, idle loss and cold bootstrap need more work).
      - name: Render Free 512 MiB memory feasibility
        id: free-memory
        continue-on-error: true
        run: |
          docker run --name tbd-render-free-memory --network host \
            --memory=512m --memory-swap=512m \
            -e APT_LOCAL_DATABASE_URL=postgresql://postgres:fixture-only@127.0.0.1:55432/postgres \
            -e HERMES_CLI=/opt/tbd/hermes/bin/hermes tbd-render-check
      - name: Record free-tier diagnostic outcome
        if: always() && steps.free-memory.outcome != 'skipped'
        env:
          DIAGNOSTIC_OUTCOME: ${{ steps.free-memory.outcome }}
        run: |
          docker inspect tbd-render-free-memory --format '{{json .State}}' > render-free-memory-state.json
          echo "512 MiB diagnostic: $DIAGNOSTIC_OUTCOME. This does not establish free deployment readiness." >> "$GITHUB_STEP_SUMMARY"
          docker rm -f tbd-render-free-memory
      - uses: actions/upload-artifact@v4
        if: always() && steps.free-memory.outcome != 'skipped'
        with:
          name: render-free-memory-diagnostic
          path: render-free-memory-state.json
